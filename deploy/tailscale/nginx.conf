events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://relay.kaleidoswap.com https://api.rgbmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    location / { try_files $uri $uri/ /index.html; }
    location = /.well-known/rgb/tokens.json { try_files $uri =404; }
    location ~ /\. { deny all; }
    location = /_headers { return 404; }
  }
}
