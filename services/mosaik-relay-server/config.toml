# Mosaik relay — curated nostr-rs-relay config.
#
# Restricts the relay to the kinds the covenant DEX protocol needs:
#   30050  Tessera / banco offer (addressable, replaceable)
#   30051  Maker profile (addressable)
#   30052  Cross-chain swap envelope (addressable; Phase 8)
#   5      Deletion event (NIP-09) — lets makers cancel a published offer
#
# Everything else is rejected at admission time. This keeps the relay's
# storage tight and makes the schema-validation hook (coming in a later
# phase) tractable — it only ever sees offer / profile / delete events.
#
# Tune the `limits` block per deployment; the defaults below are sized for
# a single-node demo.

[info]
relay_url    = "ws://localhost:7777"
name         = "Mosaik covenant-DEX relay"
description  = "Curated Nostr relay for kind-30050 covenant DEX offers (Liquid Tessera + Arkade banco)."
pubkey       = ""                      # operator pubkey; fill in for production
contact      = "ops@kaleidoswap.local"

[database]
engine            = "sqlite"
data_directory    = "/usr/src/app/db"
in_memory         = false
min_conn          = 4
max_conn          = 16

[network]
port              = 7777
address           = "0.0.0.0"
ping_interval     = 300
remote_ip_header  = "x-forwarded-for"

# ─── Event filtering ────────────────────────────────────────────────────────
[limits]
# Whitelist mode: only the kinds we care about are accepted.
event_kind_allowlist = [5, 30050, 30051, 30052]

# Backstops. Tune up for production.
messages_per_sec        = 10
subscriptions_per_min   = 60
max_blocking_threads    = 16
max_event_bytes         = 65_536          # 64 KiB — offer JSON is well below this
max_ws_message_bytes    = 131_072         # 128 KiB
max_ws_frame_bytes      = 131_072

[authorization]
# No pubkey allow-list — the relay is open. Spam controls live in [limits].
# To restrict makers to a known set, set `pubkey_whitelist` here.

[retention]
# Drop addressable offer events older than 24h. Cancelled offers should
# normally be removed via a NIP-09 kind-5 by the publisher; the retention
# window is the safety net.
max_days_30050 = 1
max_days_30051 = 7
max_days_30052 = 2

[diagnostics]
tracing = false
