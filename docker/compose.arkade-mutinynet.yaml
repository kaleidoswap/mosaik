# Mosaik — Arkade backend on Mutinynet (custom signet, ~30s blocks).
#
# Brings up the full chain a banco offer needs:
#
#   bitcoind-mutinynet ──RPC──► nbxplorer ──► arkd-wallet ──► arkd ──► introspector
#                                                                          ▲
#                                                                          └─ banco-proxy (Phase 2)
#
# Apply on top of `docker/compose.yaml`:
#
#   make dev-arkade               # equivalent to:
#   docker compose --env-file docker/.versions.env \
#                  -f docker/compose.yaml \
#                  -f docker/compose.arkade-mutinynet.yaml up
#
# First-time setup:
#   1. `cp docker/banco-mutinynet/.env.example docker/banco-mutinynet/.env`
#      and fill in the marked secrets (NBX cookie, wallet seed, introspector key).
#   2. Wait for bitcoind to download the (small) mutinynet chain.
#   3. Fund the maker / taker wallets via https://mutinynet.com/faucet — the
#      addresses are printed by `scripts/mutinynet-bootstrap.sh`.

name: mosaik

services:
  # ─── Bitcoin Core (signet / Mutinynet challenge) ───────────────────────────
  bitcoind:
    image: ${BITCOIND_MUTINYNET_IMAGE}
    container_name: mosaik-bitcoind
    restart: unless-stopped
    command:
      - -signet
      - -server=1
      - -txindex=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=mutiny
      - -rpcpassword=mutiny
      - -fallbackfee=0.0001
      # If the upstream `mutinynet/bitcoind` image already bakes in the
      # signetchallenge, the next line is redundant; harmless to leave.
      - -signetchallenge=512102f7561d208dd9ae99bf497273e16f389bdbd6c4742ddb8e6b216e64fa2928ad8f51ae
    volumes:
      - bitcoind-data:/root/.bitcoin
    ports:
      - "38332:38332"   # RPC (signet)
      - "38333:38333"   # P2P (signet)
    networks:
      - mosaik
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -signet -rpcuser=mutiny -rpcpassword=mutiny getblockchaininfo > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ─── NBXplorer (wallet indexer arkd-wallet consumes) ───────────────────────
  nbxplorer:
    image: ${NBXPLORER_IMAGE}
    container_name: mosaik-nbxplorer
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      NBXPLORER_NETWORK: signet
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_BTCRPCURL: http://bitcoind:38332
      NBXPLORER_BTCRPCUSER: mutiny
      NBXPLORER_BTCRPCPASSWORD: mutiny
      NBXPLORER_BTCNODEENDPOINT: bitcoind:38333
      NBXPLORER_NOAUTH: "true"
      NBXPLORER_CHAINS: btc
    ports:
      - "32838:32838"
    volumes:
      - nbxplorer-data:/datadir
    networks:
      - mosaik

  # ─── arkd-wallet (the wallet/signing layer in front of arkd) ───────────────
  arkd-wallet:
    image: ${ARKD_WALLET_IMAGE}
    container_name: mosaik-arkd-wallet
    restart: unless-stopped
    depends_on:
      - nbxplorer
    env_file:
      - path: banco-mutinynet/.env
        required: false
    environment:
      ARKD_WALLET_NETWORK: mutinynet
      ARKD_WALLET_NBXPLORER_URL: http://nbxplorer:32838
      ARKD_WALLET_PORT: "6060"
    volumes:
      - arkd-wallet-data:/data
    ports:
      - "6060:6060"
    networks:
      - mosaik

  # ─── arkd (the Ark server: rounds, batches, tx tree) ───────────────────────
  arkd:
    image: ${ARKD_IMAGE}
    container_name: mosaik-arkd
    restart: unless-stopped
    depends_on:
      - arkd-wallet
    env_file:
      - path: banco-mutinynet/.env
        required: false
    environment:
      ARKD_NETWORK: mutinynet
      ARKD_ESPLORA_URL: https://mutinynet.com/api
      ARKD_WALLET_ADDR: arkd-wallet:6060
      ARKD_PORT: "7070"
      ARKD_ADMIN_PORT: "7071"
    volumes:
      - arkd-data:/data
    ports:
      - "7070:7070"   # gRPC
      - "7071:7071"   # admin
    networks:
      - mosaik

  # ─── Introspector (liveness cosigner for banco covenants) ──────────────────
  introspector:
    image: ${INTROSPECTOR_IMAGE}
    container_name: mosaik-introspector
    restart: unless-stopped
    depends_on:
      - arkd
    env_file:
      - path: banco-mutinynet/.env
        required: false
    environment:
      INTROSPECTOR_NO_TLS: "true"
      INTROSPECTOR_PORT: "7073"
      INTROSPECTOR_ARKD_URL: arkd:7070
      INTROSPECTOR_LOG_LEVEL: info
      # INTROSPECTOR_SECRET_KEY: <set in .env — 32 bytes hex>
    ports:
      - "7073:7073"
    networks:
      - mosaik

  # ─── bancod (auto-taker bot — optional reference market maker) ─────────────
  # Built from source because upstream has no published image yet.
  # Uncomment to run; off by default since most dev sessions don't need it.
  #
  # bancod:
  #   build:
  #     context: ..
  #     dockerfile: docker/bancod.Dockerfile
  #     args:
  #       BANCOD_REF: ${BANCOD_REF}
  #   container_name: mosaik-bancod
  #   restart: unless-stopped
  #   depends_on:
  #     - arkd
  #     - introspector
  #   env_file:
  #     - banco-mutinynet/.env
  #   environment:
  #     BANCOD_ARK_URL: http://arkd:7070
  #     BANCOD_INTROSPECTOR_URL: http://introspector:7073
  #     BANCOD_PORT_GRPC: "7080"
  #     BANCOD_PORT_HTTP: "7081"
  #   ports:
  #     - "7080:7080"
  #     - "7081:7081"
  #   networks: [mosaik]

  # ─── banco-proxy ───────────────────────────────────────────────────────────
  # The TS gateway that exposes @arkade-os/banco Maker/Taker as a REST API
  # mosaik-api can call. SDK calls are stubbed until upstream banco hits a
  # stable channel; the HTTP contract is final.
  banco-proxy:
    image: ${BANCO_PROXY_IMAGE}
    build:
      context: ../services/banco-proxy
      dockerfile: Dockerfile
    container_name: mosaik-banco-proxy
    restart: unless-stopped
    depends_on:
      - arkd
      - introspector
    ports:
      - "3001:3001"
    environment:
      BANCO_PROXY_PORT: "3001"
      ARK_SERVER_URL: http://arkd:7070
      INTROSPECTOR_URL: http://introspector:7073
      LOG_LEVEL: info
      # Set BANCO_PROXY_JWT_SECRET in production via env_file.
    env_file:
      - path: banco-mutinynet/.env
        required: false
    networks:
      - mosaik

volumes:
  bitcoind-data:
  nbxplorer-data:
  arkd-wallet-data:
  arkd-data:
