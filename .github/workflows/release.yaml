name: release

# Triggered when a maintainer pushes a `v*` tag (e.g. `v0.2.0-platform`).
# Builds and publishes:
#   - four first-party docker images to ghcr.io/kaleidoswap/*
#   - the `mosaik` CLI as linux-x86_64 and macos-aarch64 binaries
#   - a draft GitHub Release with the binaries attached
#
# Security: inputs are limited to git-ref / git-sha / our own env block.
# No untrusted event payloads (issue titles, PR bodies, commit messages)
# are interpolated into run: scripts. Values that *do* flow into a shell
# (the tag, the target triple) are first bound to env: variables and then
# read as $VAR, per the workflow-injection mitigation guide.
on:
  push:
    tags:
      - "v*"

# `contents: write` for the GitHub Release; `packages: write` for ghcr.
permissions:
  contents: write
  packages: write

env:
  RUST_TOOLCHAIN: "1.85"
  REGISTRY: ghcr.io
  ORG: kaleidoswap

jobs:
  # ─── Docker images ──────────────────────────────────────────────────────────
  images:
    name: image · ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mosaik-api
            context: .
            dockerfile: docker/mosaik-api.Dockerfile
          - name: mosaik-webapp
            context: webapp
            dockerfile: webapp/Dockerfile
          - name: banco-proxy
            context: services/banco-proxy
            dockerfile: services/banco-proxy/Dockerfile
          - name: mosaik-relay-server
            context: services/mosaik-relay-server
            dockerfile: services/mosaik-relay-server/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  # ─── CLI binaries ───────────────────────────────────────────────────────────
  cli:
    name: cli · ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: linux-x86_64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - label: macos-aarch64
            runner: macos-14
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@v2

      - name: build
        env:
          TRIPLE: ${{ matrix.target.triple }}
        run: cargo build --release --target "$TRIPLE" --bin mosaik

      - name: package
        env:
          GH_REF: ${{ github.ref_name }}
          TRIPLE: ${{ matrix.target.triple }}
          LABEL: ${{ matrix.target.label }}
        run: |
          set -eu
          mkdir -p dist
          cp "target/${TRIPLE}/release/mosaik" "dist/mosaik"
          chmod +x dist/mosaik
          tar -czf "dist/mosaik-${GH_REF}-${LABEL}.tar.gz" -C dist mosaik

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target.label }}
          path: dist/mosaik-*.tar.gz

  # ─── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [images, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/mosaik-*.tar.gz
          body: |
            Mosaik covenant-DEX platform release.

            **Container images** (multi-arch, linux/amd64 + linux/arm64):
            - `ghcr.io/${{ env.ORG }}/mosaik-api:${{ github.ref_name }}`
            - `ghcr.io/${{ env.ORG }}/mosaik-webapp:${{ github.ref_name }}`
            - `ghcr.io/${{ env.ORG }}/banco-proxy:${{ github.ref_name }}`
            - `ghcr.io/${{ env.ORG }}/mosaik-relay-server:${{ github.ref_name }}`

            **CLI binaries** are attached below.

            Bring up the full stack with `make dev-arkade`
            (see `docker/banco-mutinynet/README.md`).
