# Sent with every page and asset. nginx drops inherited add_header lines as soon as a location
# sets its own, so each location includes this file. ${MOSAIK_CONNECT_SRC} is filled in at start.
#
# The page runs no third-party script and loads no third-party font or image. It talks to the
# Nostr relays (wss) and, for the legacy views, to its own /api. The extension reaches the page
# through window.rgb, which needs no network permission.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ${MOSAIK_CONNECT_SRC}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
