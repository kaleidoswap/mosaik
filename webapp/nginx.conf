# Mosaik webapp — nginx config for the static SPA image.
#
# Two responsibilities:
#   1. Serve the Vite build under / with SPA fallback to index.html.
#   2. Reverse-proxy /api and /healthz to mosaik-api on the docker network.
#
# `MOSAIK_API_HOST` and `MOSAIK_API_PORT` are interpolated at container start
# via envsubst (see docker-entrypoint.sh below); compose can rewire either
# without rebuilding the image.

server {
    listen       80 default_server;
    server_name  _;

    # Don't cache the entry point — content-hashed assets cache themselves.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files /index.html =404;
    }

    # Long-cache the hashed asset bundles.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: anything else that isn't a real file returns index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ─── Reverse-proxy mosaik-api ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://${MOSAIK_API_HOST}:${MOSAIK_API_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass         http://${MOSAIK_API_HOST}:${MOSAIK_API_PORT}/healthz;
        access_log         off;
    }

    # Webapp's own liveness probe (cheap; no backend dependency).
    location = /healthz-webapp {
        access_log off;
        return 200 '{"status":"ok"}';
        default_type application/json;
    }

    root   /usr/share/nginx/html;
    index  index.html;
}
